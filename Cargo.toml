[package]
name = "protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
# gpui's internal Cargo.toml uses `.workspace = true` for its sibling crates
# (gpui_macros, gpui_shared_string, gpui_platform, gpui_util, the per-OS
# backends, etc.), which only resolves inside the Zed workspace. Pulling via
# git makes cargo resolve those via Zed's own workspace. Pin a `rev` once it
# builds — gpui is pre-1.0 and breaks frequently.
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui" }
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", features = ["font-kit"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
alacritty_terminal = "0.26"
libc = "0.2"
futures = "0.3"
